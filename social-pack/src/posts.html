<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Slug-A-Bug — Social Pack 01</title>
<style>
  @font-face{font-family:'Anton';src:url('fonts/anton-latin-400-normal.woff2') format('woff2');font-weight:400;}
  @font-face{font-family:'Barlow';src:url('fonts/barlow-latin-400-normal.woff2') format('woff2');font-weight:400;}
  @font-face{font-family:'Barlow';src:url('fonts/barlow-latin-500-normal.woff2') format('woff2');font-weight:500;}
  @font-face{font-family:'Barlow';src:url('fonts/barlow-latin-600-normal.woff2') format('woff2');font-weight:600;}
  @font-face{font-family:'Barlow';src:url('fonts/barlow-latin-700-normal.woff2') format('woff2');font-weight:700;}
  @font-face{font-family:'Barlow';src:url('fonts/barlow-latin-800-normal.woff2') format('woff2');font-weight:800;}
  @font-face{font-family:'Barlow Condensed';src:url('fonts/barlow-condensed-latin-500-normal.woff2') format('woff2');font-weight:500;}
  @font-face{font-family:'Barlow Condensed';src:url('fonts/barlow-condensed-latin-600-normal.woff2') format('woff2');font-weight:600;}
  @font-face{font-family:'Barlow Condensed';src:url('fonts/barlow-condensed-latin-700-normal.woff2') format('woff2');font-weight:700;}

  :root{
    --red:#EE1C24;
    --ink:#150404;
    --paper:#FFFFFF;
    --bone:#F5F2ED;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#333;font-family:'Barlow',sans-serif;}

  .slide{
    width:1080px;height:1350px;position:relative;overflow:hidden;
    margin:24px auto;background:var(--paper);
  }

  /* ---------- shared chrome ---------- */
  .topbar{
    position:absolute;top:0;left:0;right:0;height:132px;
    display:flex;align-items:center;justify-content:space-between;
    padding:0 64px;z-index:20;
  }
  .site{
    font-family:'Barlow Condensed';font-weight:600;font-size:30px;
    letter-spacing:.22em;text-transform:uppercase;
  }
  .logo{ text-align:right;line-height:1; }
  .logo .l1{
    font-family:'Anton';font-size:52px;letter-spacing:.01em;
    color:var(--red);transform:skewX(-6deg);display:inline-block;
  }
  .logo .l2{
    font-family:'Barlow Condensed';font-weight:600;font-size:24.5px;
    letter-spacing:.415em;text-transform:uppercase;margin-top:8px;
    display:flex;align-items:center;justify-content:flex-end;gap:0;
  }
  .logo .l2 svg{margin:0 2px -1px 3px;}

  .ctazone{position:absolute;left:0;right:0;bottom:0;z-index:20;}
  .strap{
    height:96px;display:flex;align-items:center;justify-content:center;
    font-family:'Barlow';font-weight:600;font-size:34px;letter-spacing:.02em;
  }
  .ctabar{
    height:118px;background:var(--red);color:#fff;
    display:flex;align-items:center;justify-content:center;gap:26px;
  }
  .ctabar .a{font-family:'Barlow Condensed';font-weight:600;font-size:40px;letter-spacing:.12em;text-transform:uppercase;}
  .ctabar .b{font-family:'Anton';font-size:56px;letter-spacing:.02em;}
  .microline{
    height:64px;background:var(--ink);color:rgba(255,255,255,.72);
    display:flex;align-items:center;justify-content:center;gap:34px;
    font-family:'Barlow Condensed';font-weight:500;font-size:23px;letter-spacing:.14em;text-transform:uppercase;
  }
  .microline b{color:#fff;font-weight:600;}

  .kicker{
    display:inline-flex;align-items:center;gap:16px;
    font-family:'Barlow Condensed';font-weight:600;font-size:30px;
    letter-spacing:.3em;text-transform:uppercase;
  }
  .kicker .tag{
    background:var(--red);color:#fff;padding:10px 22px 8px;letter-spacing:.24em;
  }

  .display{font-family:'Anton';text-transform:uppercase;}

  /* crosshair visual */
  .vis{position:absolute;z-index:5;}

  /* tick list */
  .ticks{list-style:none;}
  .ticks li{
    display:flex;align-items:center;gap:24px;
    font-family:'Barlow';font-weight:500;font-size:37px;line-height:1.25;
  }
  .ticks li + li{margin-top:20px;}
  .ticks .tk{
    flex:0 0 48px;height:48px;background:var(--red);
    display:flex;align-items:center;justify-content:center;
  }
  .bignum{font-family:'Anton';}
  .rule{position:absolute;background:var(--ink);}
</style>
</head>
<body>
<div id="slides"></div>

<script>
/* =========================================================
   SLUG-A-BUG SOCIAL PACK 01 — magazine-style post generator
   ========================================================= */

const RED = '#EE1C24', INK = '#150404', PAPER = '#FFFFFF', BONE = '#F5F2ED';

/* ---------- brand lockup ---------- */
function crosshairO(color, size){
  const s = size || 25;
  return `<svg width="${s}" height="${s}" viewBox="0 0 40 40" fill="none">
    <circle cx="20" cy="20" r="14" stroke="${color}" stroke-width="5"/>
    <line x1="20" y1="0" x2="20" y2="9"  stroke="${color}" stroke-width="5"/>
    <line x1="20" y1="31" x2="20" y2="40" stroke="${color}" stroke-width="5"/>
    <line x1="0"  y1="20" x2="9"  y2="20" stroke="${color}" stroke-width="5"/>
    <line x1="31" y1="20" x2="40" y2="20" stroke="${color}" stroke-width="5"/>
    <circle cx="20" cy="20" r="4.5" fill="${color}"/>
  </svg>`;
}
function logoHTML(sub, l1){ // sub = colour of "PEST CONTROL" line, l1 = wordmark colour
  return `<div class="logo">
    <span class="l1" style="color:${l1||RED}">SLUG-A-BUG</span>
    <span class="l2" style="color:${sub}">PEST&nbsp;C${crosshairO(sub)}NTROL</span>
  </div>`;
}

/* ---------- scene backdrops + swappable real-photo slot ----------
   Drop a real photo at src/photos/post-NNN.jpg (or .png) and it replaces
   that post's generated scene automatically, under a brand scrim. */
const GRAIN = `url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22240%22 height=%22240%22><filter id=%22n%22><feTurbulence type=%22fractalNoise%22 baseFrequency=%220.9%22 numOctaves=%222%22/><feColorMatrix type=%22saturate%22 values=%220%22/></filter><rect width=%22240%22 height=%22240%22 filter=%22url(%23n)%22 opacity=%220.55%22/></svg>')`;
function bgLayer(tone, n){
  const id = 'post-'+String(n).padStart(3,'0');
  const photo = (window.PHOTOS||{})[id];
  const scrims = {light:'rgba(245,242,237,.9)', dark:'rgba(21,4,4,.86)', red:'rgba(228,22,30,.88)'};
  if(photo){
    return `<div style="position:absolute;inset:0;background:url('photos/${photo}') center/cover"></div>
      <div style="position:absolute;inset:0;background:${scrims[tone]}"></div>`;
  }
  const scenes = {
    light: `<div style="position:absolute;inset:0;background:linear-gradient(180deg,#F9F6F1 0%,#F3EFE8 56%,#E8E2D7 56.2%,#DBD3C4 100%)"></div>
      <div style="position:absolute;inset:0;background:radial-gradient(ellipse 900px 620px at 78% 28%, rgba(255,255,255,.75), transparent 62%)"></div>
      <div style="position:absolute;inset:0;background:radial-gradient(ellipse 1400px 1100px at 50% 45%, transparent 55%, rgba(21,4,4,.10))"></div>`,
    dark: `<div style="position:absolute;inset:0;background:linear-gradient(180deg,#200909 0%,#150404 55%,#0C0202 100%)"></div>
      <div style="position:absolute;inset:0;background:radial-gradient(ellipse 820px 700px at 80% 20%, rgba(238,28,36,.15), transparent 62%)"></div>
      <div style="position:absolute;inset:0;background:radial-gradient(ellipse 1400px 1100px at 50% 45%, transparent 55%, rgba(0,0,0,.5))"></div>`,
    red: `<div style="position:absolute;inset:0;background:linear-gradient(180deg,#F5343B 0%,#EE1C24 48%,#C8141B 100%)"></div>
      <div style="position:absolute;inset:0;background:radial-gradient(ellipse 900px 620px at 50% 20%, rgba(255,255,255,.15), transparent 62%)"></div>
      <div style="position:absolute;inset:0;background:radial-gradient(ellipse 1400px 1100px at 50% 45%, transparent 55%, rgba(80,4,8,.35))"></div>`,
  };
  return scenes[tone] + `<div style="position:absolute;inset:0;background:${GRAIN};opacity:${tone==='light'?0.05:0.09}"></div>`;
}

/* ---------- crosshair target rings ---------- */
function targetRings(color, size, op){
  return `<svg width="${size}" height="${size}" viewBox="0 0 400 400" fill="none" style="opacity:${op}">
    <circle cx="200" cy="200" r="192" stroke="${color}" stroke-width="3"/>
    <circle cx="200" cy="200" r="148" stroke="${color}" stroke-width="2" stroke-dasharray="10 12"/>
    <circle cx="200" cy="200" r="104" stroke="${color}" stroke-width="3"/>
    <line x1="200" y1="0"   x2="200" y2="58"  stroke="${color}" stroke-width="4"/>
    <line x1="200" y1="342" x2="200" y2="400" stroke="${color}" stroke-width="4"/>
    <line x1="0"   y1="200" x2="58"  y2="200" stroke="${color}" stroke-width="4"/>
    <line x1="342" y1="200" x2="400" y2="200" stroke="${color}" stroke-width="4"/>
  </svg>`;
}

/* ---------- pest silhouettes (viewBox 0 0 100 100) ---------- */
const ICONS = {
cockroach: c => `
  <g stroke="${c}" fill="none" stroke-width="3" stroke-linecap="round">
    <path d="M42 22 C 30 8, 16 6, 8 12"/><path d="M58 22 C 70 8, 84 6, 92 12"/>
    <path d="M28 44 L 8 36"/><path d="M26 58 L 6 58"/><path d="M30 72 L 12 84"/>
    <path d="M72 44 L 92 36"/><path d="M74 58 L 94 58"/><path d="M70 72 L 88 84"/>
  </g>
  <ellipse cx="50" cy="60" rx="21" ry="32" fill="${c}"/>
  <circle cx="50" cy="26" r="11" fill="${c}"/>
  <path d="M32 52 Q 50 60 68 52" stroke="${PAPER}" stroke-opacity=".0" fill="none"/>
  <line x1="50" y1="34" x2="50" y2="88" stroke-opacity=".35" stroke="${c==='#FFFFFF'?INK:PAPER}" stroke-width="2"/>`,
termite: c => `
  <g stroke="${c}" fill="none" stroke-width="3" stroke-linecap="round">
    <path d="M43 14 C 36 6, 26 4, 20 8"/><path d="M57 14 C 64 6, 74 4, 80 8"/>
    <path d="M34 40 L 14 34"/><path d="M33 52 L 12 52"/><path d="M36 64 L 16 74"/>
    <path d="M66 40 L 86 34"/><path d="M67 52 L 88 52"/><path d="M64 64 L 84 74"/>
    <path d="M44 10 L 39 2"/><path d="M56 10 L 61 2"/>
  </g>
  <circle cx="50" cy="20" r="12" fill="${c}"/>
  <circle cx="50" cy="40" r="10" fill="${c}"/>
  <ellipse cx="50" cy="70" rx="17" ry="26" fill="${c}"/>`,
ant: c => `
  <g stroke="${c}" fill="none" stroke-width="3" stroke-linecap="round">
    <path d="M44 16 C 36 8, 28 6, 22 10"/><path d="M56 16 C 64 8, 72 6, 78 10"/>
    <path d="M38 44 L 16 36"/><path d="M37 52 L 12 54"/><path d="M40 60 L 20 76"/>
    <path d="M62 44 L 84 36"/><path d="M63 52 L 88 54"/><path d="M60 60 L 80 76"/>
  </g>
  <circle cx="50" cy="24" r="12" fill="${c}"/>
  <ellipse cx="50" cy="48" rx="9" ry="11" fill="${c}"/>
  <ellipse cx="50" cy="76" rx="15" ry="18" fill="${c}"/>`,
spider: c => `
  <g stroke="${c}" fill="none" stroke-width="4" stroke-linecap="round">
    <path d="M40 44 C 24 34, 16 24, 14 10"/><path d="M60 44 C 76 34, 84 24, 86 10"/>
    <path d="M36 52 C 20 48, 10 42, 4 32"/><path d="M64 52 C 80 48, 90 42, 96 32"/>
    <path d="M36 60 C 20 64, 10 70, 4 80"/><path d="M64 60 C 80 64, 90 70, 96 80"/>
    <path d="M40 68 C 28 78, 22 86, 20 96"/><path d="M60 68 C 72 78, 78 86, 80 96"/>
  </g>
  <circle cx="50" cy="40" r="11" fill="${c}"/>
  <ellipse cx="50" cy="64" rx="17" ry="20" fill="${c}"/>`,
rat: c => `
  <path d="M14 68 C 14 46, 34 32, 54 32 C 74 32, 88 46, 88 62 C 88 70, 82 76, 72 76 L 26 76 C 18 76, 14 73, 14 68 Z" fill="${c}"/>
  <circle cx="72" cy="34" r="12" fill="${c}"/>
  <circle cx="83" cy="26" r="7" fill="${c}"/>
  <g stroke="${c}" fill="none" stroke-width="3.5" stroke-linecap="round">
    <path d="M26 76 C 12 76, 4 68, 6 56"/>
    <path d="M88 56 C 96 60, 98 66, 96 72"/>
    <line x1="34" y1="76" x2="34" y2="88"/><line x1="52" y1="76" x2="52" y2="88"/><line x1="68" y1="76" x2="68" y2="88"/>
  </g>`,
wasp: c => `
  <g stroke="${c}" fill="none" stroke-width="3" stroke-linecap="round">
    <path d="M46 18 C 40 10, 32 6, 26 8"/><path d="M54 18 C 60 10, 68 6, 74 8"/>
    <path d="M38 46 L 18 42"/><path d="M37 54 L 14 58"/><path d="M62 46 L 82 42"/><path d="M63 54 L 86 58"/>
  </g>
  <ellipse cx="24" cy="38" rx="17" ry="8" fill="${c}" opacity=".45" transform="rotate(-30 24 38)"/>
  <ellipse cx="76" cy="38" rx="17" ry="8" fill="${c}" opacity=".45" transform="rotate(30 76 38)"/>
  <circle cx="50" cy="24" r="10" fill="${c}"/>
  <ellipse cx="50" cy="44" rx="11" ry="12" fill="${c}"/>
  <path d="M50 56 C 62 56, 68 66, 66 76 C 64 88, 56 96, 50 96 C 44 96, 36 88, 34 76 C 32 66, 38 56, 50 56 Z" fill="${c}"/>
  <g stroke="${c==='#FFFFFF'?INK:PAPER}" stroke-width="4">
    <line x1="35" y1="70" x2="65" y2="70"/><line x1="37" y1="82" x2="63" y2="82"/>
  </g>`,
bedbug: c => `
  <g stroke="${c}" fill="none" stroke-width="3" stroke-linecap="round">
    <path d="M42 20 C 36 12, 30 10, 24 12"/><path d="M58 20 C 64 12, 70 10, 76 12"/>
    <path d="M32 42 L 12 36"/><path d="M30 56 L 8 56"/><path d="M33 70 L 14 80"/>
    <path d="M68 42 L 88 36"/><path d="M70 56 L 92 56"/><path d="M67 70 L 86 80"/>
  </g>
  <circle cx="50" cy="24" r="9" fill="${c}"/>
  <path d="M50 30 C 68 30, 78 44, 78 60 C 78 78, 66 90, 50 90 C 34 90, 22 78, 22 60 C 22 44, 32 30, 50 30 Z" fill="${c}"/>
  <g stroke="${c==='#FFFFFF'?INK:PAPER}" stroke-width="2.5" opacity=".5" fill="none">
    <path d="M28 52 L 72 52"/><path d="M27 64 L 73 64"/><path d="M31 76 L 69 76"/>
  </g>`,
flea: c => `
  <path d="M30 78 C 18 70, 14 52, 24 38 C 34 24, 56 20, 70 30 C 82 38, 86 54, 78 66 C 72 76, 60 82, 46 82 Z" fill="${c}"/>
  <circle cx="74" cy="34" r="9" fill="${c}"/>
  <g stroke="${c}" fill="none" stroke-width="4" stroke-linecap="round">
    <path d="M40 82 C 36 90, 30 94, 22 94"/>
    <path d="M58 82 C 58 92, 52 98, 44 98"/>
    <path d="M30 60 C 18 62, 12 68, 10 76"/>
    <path d="M80 42 L 92 38"/>
  </g>`,
mosquito: c => `
  <ellipse cx="38" cy="40" rx="24" ry="9" fill="${c}" opacity=".4" transform="rotate(-18 38 40)"/>
  <ellipse cx="66" cy="34" rx="24" ry="9" fill="${c}" opacity=".4" transform="rotate(14 66 34)"/>
  <circle cx="50" cy="26" r="7" fill="${c}"/>
  <ellipse cx="50" cy="42" rx="9" ry="10" fill="${c}"/>
  <path d="M50 52 L 58 88 L 50 84 L 46 60 Z" fill="${c}"/>
  <g stroke="${c}" fill="none" stroke-width="3" stroke-linecap="round">
    <line x1="50" y1="19" x2="50" y2="2"/>
    <path d="M42 46 L 20 56"/><path d="M44 52 L 26 70"/><path d="M58 46 L 80 56"/><path d="M56 52 L 74 70"/>
  </g>`,
silverfish: c => `
  <path d="M50 8 C 62 22, 66 44, 62 62 C 59 76, 55 86, 50 94 C 45 86, 41 76, 38 62 C 34 44, 38 22, 50 8 Z" fill="${c}"/>
  <g stroke="${c}" fill="none" stroke-width="3" stroke-linecap="round">
    <path d="M46 12 C 38 6, 30 4, 22 8"/><path d="M54 12 C 62 6, 70 4, 78 8"/>
    <path d="M50 94 L 42 108" /><path d="M50 94 L 50 110"/><path d="M50 94 L 58 108"/>
    <path d="M40 34 L 24 30"/><path d="M38 48 L 22 48"/><path d="M60 34 L 76 30"/><path d="M62 48 L 78 48"/>
  </g>`,
shield: c => `
  <path d="M50 6 L 88 20 C 88 52, 80 80, 50 94 C 20 80, 12 52, 12 20 Z" fill="${c}"/>
  <path d="M32 48 L 45 61 L 70 34" stroke="${c==='#FFFFFF'?INK:PAPER}" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`,
star: c => `
  <path d="M50 6 L 61 36 L 94 37 L 68 57 L 78 90 L 50 71 L 22 90 L 32 57 L 6 37 L 39 36 Z" fill="${c}"/>`,
house: c => `
  <path d="M50 10 L 92 46 L 82 46 L 82 90 L 18 90 L 18 46 L 8 46 Z" fill="${c}"/>
  <rect x="42" y="60" width="16" height="30" fill="${c==='#FFFFFF'?INK:PAPER}"/>`,
magnify: c => `
  <circle cx="42" cy="42" r="28" stroke="${c}" stroke-width="9" fill="none"/>
  <line x1="63" y1="63" x2="92" y2="92" stroke="${c}" stroke-width="12" stroke-linecap="round"/>
  <circle cx="42" cy="42" r="7" fill="${c}"/>`
};

function pestVis(icon, ringColor, pestColor, size, op){
  const inner = Math.round(size*0.46);
  const pad = Math.round((size-inner)/2);
  return `<div style="position:relative;width:${size}px;height:${size}px">
    <div style="position:absolute;inset:0">${targetRings(ringColor,size,op)}</div>
    <svg width="${inner}" height="${inner}" viewBox="0 0 100 112" fill="none"
         style="position:absolute;left:${pad}px;top:${pad}px">${ICONS[icon](pestColor)}</svg>
  </div>`;
}

/* ---------- shared chrome builders ---------- */
function topbar(scheme){
  // scheme: {site, sub, l1}
  return `<div class="topbar">
    <div class="site" style="color:${scheme.site}">slugabug.com.au</div>
    ${logoHTML(scheme.sub, scheme.l1)}
  </div>`;
}
function ctazone(o){
  // o: {strapBg, strapColor, strap, barBg, barColor, cta}
  return `<div class="ctazone">
    <div class="strap" style="background:${o.strapBg};color:${o.strapColor}">${o.strap}</div>
    <div class="ctabar" style="background:${o.barBg};color:${o.barColor}">
      <span class="a">${o.cta || 'Call today for a free quote'}</span>
      <span class="b">(07)&nbsp;3113&nbsp;9666</span>
    </div>
    <div class="microline">
      <span>QLD Pest Lic <b>PMT&nbsp;1004307814</b></span><span>·</span>
      <span>QBCC <b>1122314</b></span><span>·</span>
      <span>Family owned · 20+ years</span>
    </div>
  </div>`;
}
function kicker(text, tag, color){
  return `<div class="kicker" style="color:${color}">
    <span class="tag">${tag}</span><span>${text}</span>
  </div>`;
}

/* =========================================================
   LAYOUTS
   ========================================================= */

/* L1 — COVER LIGHT (clone of reference structure) */
function coverLight(p, n){
  return `
  <div class="slide" style="background:${BONE}">
    ${bgLayer('light', n)}
    <div class="vis" style="right:-130px;top:420px">${pestVis(p.icon, RED, INK, 620, .8)}</div>
    ${topbar({site:INK, sub:INK})}
    <div style="position:absolute;left:64px;top:186px;bottom:300px;width:960px;z-index:10;display:flex;flex-direction:column">
      <div>${kicker(p.kick, p.tag, INK)}</div>
      <div class="display" style="font-size:${p.hSize||140}px;line-height:.95;color:${INK};margin-top:38px;width:${p.hWidth||700}px">${p.head}</div>
      <div class="display" style="font-size:${p.sSize||60}px;line-height:1.04;color:${RED};margin-top:26px;width:${p.sWidth||620}px">${p.subhead}</div>
      <div style="font-size:38px;line-height:1.38;font-weight:500;color:${INK};margin-top:auto;padding-top:30px;width:${p.bWidth||560}px">${p.body}</div>
    </div>
    ${ctazone({strapBg:PAPER, strapColor:INK, strap:p.strap, barBg:RED, barColor:'#fff', cta:p.cta})}
  </div>`;
}

/* L2 — COVER DARK */
function coverDark(p, n){
  return `
  <div class="slide" style="background:${INK}">
    ${bgLayer('dark', n)}
    <div class="vis" style="right:-150px;top:150px">${pestVis(p.icon, RED, 'rgba(255,255,255,.25)', 700, .9)}</div>
    ${topbar({site:'rgba(255,255,255,.85)', sub:'#fff'})}
    <div style="position:absolute;left:64px;top:200px;bottom:310px;width:960px;z-index:10;display:flex;flex-direction:column">
      <div>${kicker(p.kick, p.tag, 'rgba(255,255,255,.85)')}</div>
      <div class="display" style="font-size:${p.hSize||120}px;line-height:.95;color:#fff;margin-top:40px;width:${p.hWidth||860}px">${p.head}</div>
      <div class="display" style="font-size:${p.sSize||60}px;line-height:1.04;color:${RED};margin-top:26px;width:${p.sWidth||760}px">${p.subhead}</div>
      <div style="font-size:38px;line-height:1.38;font-weight:500;color:rgba(255,255,255,.88);margin-top:auto;padding-top:30px;width:${p.bWidth||760}px">${p.body}</div>
    </div>
    ${ctazone({strapBg:RED, strapColor:'#fff', strap:p.strap, barBg:PAPER, barColor:INK, cta:p.cta})}
  </div>`;
}

/* L3 — RED POSTER */
function redPoster(p, n){
  return `
  <div class="slide" style="background:${RED}">
    ${bgLayer('red', n)}
    ${topbar({site:'#fff', sub:'#fff', l1:'#fff'})}
    <div style="position:absolute;left:64px;right:64px;top:186px;bottom:300px;z-index:10;display:flex;flex-direction:column;align-items:center;text-align:center">
      <div class="kicker" style="color:#fff;justify-content:center">
        <span class="tag" style="background:${INK}">${p.tag}</span><span>${p.kick}</span>
      </div>
      <div style="margin:20px 0 16px">${pestVis(p.icon, 'rgba(255,255,255,.55)', '#fff', 260, .9)}</div>
      <div class="display" style="font-size:${p.hSize||100}px;line-height:.96;color:#fff;width:${p.hWidth||920}px">${p.head}</div>
